<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASIRkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  /* Plan: hoja técnica de sala de servidores. Gesto fuerte único: etiquetas de rotuladora
     (como las que se pegan en los racks) para la marca y los títulos de módulo, y el mapa
     de direcciones dibujado como un panel de puertos. Todo lo demás, sobrio. */
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#15202b; --muted:#5a6673; --line:#d4dbe2;
  --accent:#1d5bd6; --accent-soft:#e3ecfd; --accent-ink:#ffffff;
  --tape:#16191d; --tape-ink:#f4f4ef;
  --code-bg:#111a23; --code-ink:#dde6ef; --code-muted:#7d8fa1; --code-kw:#8cb6ff; --code-hd:#f2c46d;
  --ok:#1d7f4a; --warn:#a86a00; --err:#c0392b;
  --c-net:#5a6673; --c-gw:#1d5bd6; --c-srv:#c0392b; --c-pool:#e0a21b; --c-res:#2f9e5b; --c-fija:#7a4fd0; --c-free:#e2e7ec;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --surface:#161d25; --surface-2:#1b232c; --ink:#e5eaf0; --muted:#97a4b2; --line:#2a3541;
    --accent:#6f9dff; --accent-soft:#1c2a45; --accent-ink:#0b1220;
    --tape:#ecebe4; --tape-ink:#16191d;
    --code-bg:#0a0f14; --code-ink:#dde6ef; --code-muted:#73869a; --code-kw:#8cb6ff; --code-hd:#f2c46d;
    --ok:#46b97a; --warn:#e0a640; --err:#ef6b5b;
    --c-net:#7d8b99; --c-gw:#6f9dff; --c-srv:#ef6b5b; --c-pool:#e0a640; --c-res:#46b97a; --c-fija:#a985f0; --c-free:#25303b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#161d25; --surface-2:#1b232c; --ink:#e5eaf0; --muted:#97a4b2; --line:#2a3541;
  --accent:#6f9dff; --accent-soft:#1c2a45; --accent-ink:#0b1220;
  --tape:#ecebe4; --tape-ink:#16191d;
  --code-bg:#0a0f14; --code-ink:#dde6ef; --code-muted:#73869a; --code-kw:#8cb6ff; --code-hd:#f2c46d;
  --ok:#46b97a; --warn:#e0a640; --err:#ef6b5b;
  --c-net:#7d8b99; --c-gw:#6f9dff; --c-srv:#ef6b5b; --c-pool:#e0a640; --c-res:#46b97a; --c-fija:#a985f0; --c-free:#25303b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--f-mono)}

/* Etiqueta de rotuladora */
.tape{display:inline-block;background:var(--tape);color:var(--tape-ink);font-family:var(--f-display);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;padding:.18em .7em .14em;border-radius:2px;
  box-shadow:0 1px 0 rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.06);position:relative}
.tape::before,.tape::after{content:"";position:absolute;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--tape-ink);opacity:.35}
.tape::before{left:5px}.tape::after{right:5px}

/* Cabecera */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand .tape{font-size:22px}
.brand p{margin:0;color:var(--muted);font-size:14px;max-width:44ch}
.proj{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:240px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.chip b{font-weight:600}
.chip.state-ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
.chip.state-warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}
.chip.state-err{border-color:color-mix(in srgb,var(--err) 45%,var(--line));color:var(--err)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent}

/* Layout */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 70px)}
nav.side{border-right:1px solid var(--line);padding:18px 12px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.navlabel{font:600 11px/1 var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:6px 10px 10px}
.navitem{display:grid;grid-template-columns:28px 1fr 10px;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:500;font-size:14.5px}
.navitem .n{font:500 12px/1 var(--f-mono);color:var(--muted)}
.navitem:hover{background:var(--surface-2)}
.navitem[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navitem[aria-current="page"] .n{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:transparent}
.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}
.navfoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line)}

main{padding:22px 24px 40px;min-width:0}
.modhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.modhead .num{font:500 14px var(--f-mono);color:var(--muted)}
.modhead h1 .tape{font-size:19px}
.lede{color:var(--muted);margin:6px 0 20px;max-width:75ch}
.grid2{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h3{font:600 12.5px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:4px 0 12px}
.panel h3:not(:first-child){margin-top:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea,.row input,.row select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:7px 9px;font-family:var(--f-mono);font-size:13.5px}
.f textarea{min-height:150px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus,.row input:focus,.row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f small{color:var(--muted);font-size:12px}
.bad{border-color:var(--err)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--err) 18%,transparent)!important}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;padding:4px 0;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface-2);padding:6px 11px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;gap:6px;align-items:center}
.row.res{grid-template-columns:1fr 1fr 28px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.row.res .rn{grid-column:1/3}
.row.rec{grid-template-columns:78px 1fr 1.2fr 28px}
.row.head{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.del{width:28px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.del:hover{color:var(--err);border-color:var(--err)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 var(--r) var(--r) 0;margin-top:12px}

/* Salida */
.out{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--surface-2)}
.tab{border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 12px;border-radius:7px 7px 0 0;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);margin-bottom:-1px}
.os{font:600 10.5px/1 var(--f-mono);padding:3px 5px;border-radius:3px;background:var(--line);color:var(--ink)}
.os.win{background:#2563c9;color:#fff}.os.lin{background:#d2531f;color:#fff}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.toolbar .fname{font:500 13px var(--f-mono);flex:1;min-width:150px}
.toolbar .fname small{color:var(--muted);font-family:var(--f-body)}
.switch{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer}
.switch input{accent-color:var(--accent)}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);font:13px/1.6 var(--f-mono);padding:14px 16px;overflow:auto;max-height:620px;tab-size:2}
pre.code .cm{color:var(--code-muted)}
pre.code .hd{color:var(--code-hd);font-weight:500}
pre.code .kw{color:var(--code-kw)}
.howto{padding:10px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.howto code{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12.5px;color:var(--ink)}

/* Plan de red */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--surface);padding:10px 12px}
.stat span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat b{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.ports{display:grid;grid-template-columns:repeat(32,1fr);gap:3px;margin-top:6px;padding:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.port{aspect-ratio:1;border-radius:2px;background:var(--c-free);position:relative}
.port.net,.port.bc{background:var(--c-net)}
.port.gw{background:var(--c-gw)}
.port.srv{background:var(--c-srv)}
.port.pool{background:var(--c-pool)}
.port.res{background:var(--c-res)}
.port.fija{background:var(--c-fija)}
.port.res.inpool,.port.fija.inpool{box-shadow:inset 0 0 0 2px var(--c-pool)}
.port:hover{outline:2px solid var(--ink);outline-offset:1px;z-index:1}
.bar{position:relative;height:30px;border-radius:6px;background:var(--c-free);margin-top:8px;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;top:0;bottom:0;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.hover-ip{font:500 13px var(--f-mono);margin-top:8px;min-height:20px;color:var(--ink)}
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issues li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13.5px;padding:8px 10px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.pill{font:600 10.5px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;padding:4px 6px;border-radius:3px;color:#fff;margin-top:1px}
.pill.err{background:var(--err)}.pill.warn{background:var(--warn)}.pill.ok{background:var(--ok)}.pill.tip{background:var(--accent);color:var(--accent-ink)}
.issues .mod{font:500 12px var(--f-mono);color:var(--muted)}

/* Chuleta */
.cheat-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.cheat-tools input{flex:1;min-width:220px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cheat{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cheat th{text-align:left;font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.cheat td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.cheat tr:last-child td{border-bottom:0}
.cheat td.task b{display:block;font-weight:600}
.cheat td.task span{font-size:12px;color:var(--muted)}
.cmd{display:block;width:100%;text-align:left;font:12.5px/1.45 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:5px 8px;cursor:pointer;margin-bottom:4px;white-space:pre-wrap;word-break:break-word}
.cmd:hover{border-color:var(--accent)}
.cmd.na{cursor:default;color:var(--muted);font-family:var(--f-body);font-style:italic}
.cmd.na:hover{border-color:var(--line)}
.cheat-wrap{overflow-x:auto}

/* Modal y aviso */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(640px,100%);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal textarea{width:100%;min-height:260px;font:12.5px/1.5 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.modal .row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

@media (max-width: 1100px){ .grid2{grid-template-columns:1fr} }
@media (max-width: 760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .layout{grid-template-columns:1fr}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .navlabel,.navfoot{display:none}
  .navitem{grid-template-columns:auto auto 8px;white-space:nowrap}
  main{padding:16px}
  .top{padding:12px 16px}
  .fields{grid-template-columns:1fr}
  .ports{gap:2px;padding:6px}
}

/* ---- v2: nivel, catálogo y modo profesional ---- */
:root{ --pro:#7444c9; --pro-soft:#efe8fb; --c-fija:#0f8f8a; --c-srv2:#e98b7f; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --pro:#b18cff; --pro-soft:#2a2140; --c-fija:#3cc2bb; --c-srv2:#a8544b; } }
:root[data-theme="dark"]{ --pro:#b18cff; --pro-soft:#2a2140; --c-fija:#3cc2bb; --c-srv2:#a8544b; }

.level{display:flex;align-items:center;gap:8px}
.level>span{font:600 11px/1 var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.level .seg button{padding:7px 13px;font-weight:500}
.level .seg button[data-nivel="pro"][aria-pressed="true"]{background:var(--pro);color:#fff}
body.is-pro .top{box-shadow:inset 0 -3px 0 var(--pro)}

.navadd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;margin-bottom:10px;border:1px dashed var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.navadd:hover{border-color:var(--accent);color:var(--accent)}
.navadd[aria-current="page"]{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.navadd .cnt{font:500 12px var(--f-mono);color:var(--muted)}

.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:26px}
.lvl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.lvl:hover{border-color:var(--accent)}
.lvl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lvl.pro[aria-pressed="true"]{border-color:var(--pro);box-shadow:0 0 0 3px var(--pro-soft)}
.lvl b{font:700 18px var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.lvl.pro b{color:var(--pro)}
.lvl span{color:var(--muted);font-size:14px}
.catgroup{margin-bottom:22px}
.catgroup h2{font:600 12.5px/1 var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
.card.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.card .ct{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .ct b{font-size:15.5px}
.card p{margin:0;font-size:13.5px;color:var(--muted)}
.card .prol{font-size:12.5px;color:var(--ink);background:var(--pro-soft);border-radius:6px;padding:6px 8px}
.card .prol::before{content:"PRO";font:700 10px/1 var(--f-display);letter-spacing:.1em;color:#fff;background:var(--pro);border-radius:3px;padding:3px 5px;margin-right:7px;vertical-align:1px}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px}
.oss{display:flex;gap:4px}
.card .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card .fixed{font-size:12.5px;color:var(--muted);font-weight:600}
.card .req{font-size:12px;color:var(--warn)}

.profields{margin-top:18px;padding:12px;border:1px solid color-mix(in srgb,var(--pro) 40%,var(--line));border-radius:8px;background:var(--pro-soft)}
.profields>h3{color:var(--pro)!important;margin-top:0!important;display:flex;align-items:center;gap:8px}
.profields .f input,.profields .f select{background:var(--surface)}
.badge-pro{font:700 10px/1 var(--f-display);letter-spacing:.1em;color:#fff;background:var(--pro);border-radius:3px;padding:3px 5px}
pre.code .pro{color:#c6a6ff;font-weight:500}
.checks{display:grid;grid-template-columns:1fr;gap:2px}
.row.res{grid-template-columns:1fr 1fr 28px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.row.res .rn{grid-column:1/3}

<script>
/* ============================================================
   ASIRkit v2 · estado del proyecto

const EJEMPLO = {

  red: "192.168.10.0", prefijo: 24, gw: "192.168.10.1",

  srv2Ip: "192.168.10.11", srv2Nombre: "SRV02", adminNet: "192.168.10.0/24",

  ],

    { tipo: "A", nombre: "impresora01", valor: "192.168.10.50" },
    { tipo: "A", nombre: "mail", valor: "192.168.10.20" },
    { tipo: "CNAME", nombre: "intranet", valor: "srv01" },

  ],

  csv: "nombre;apellidos;departamento;usuario\nAna;García López;Ventas;\nLuis;Martín Pérez;Ventas;\nMarta;Sánchez Ruiz;Informática;\nJorge;Fernández Gil;Informática;jfernandez\nLucía;Romero Díaz;RRHH;",
  gpoPanel: true, gpoCmd: true, gpoUsb: true, gpoFondo: false, fondoRuta: "\\\\SRV01\\Comun\\fondo.jpg", gpoBloqueo: true,
  rutaWin: "D:\\Compartido", rutaLin: "/srv/samba", carpetas: "Ventas, Informática, RRHH", comun: true, cuotaGB: 5,
  webHost: "intranet", webRaizWin: "C:\\inetpub\\intranet", webRaizLin: "/var/www/intranet",
  ftpRutaWin: "C:\\ftp", pasvMin: 50000, pasvMax: 50100,

  bkHora: "21:00", bkDias: 14, bkRemoto: "backup@192.168.10.12:/backups/srv01"
};
const CLAVE = "asirkit-proyecto-v2";
let primeraVez = false;
let S = cargar();
const UI = { tab: {}, comentarios: true, chuletaQ: "", chuletaCat: "Todas" };

function cargar(){
  try { const t = localStorage.getItem(CLAVE); if (t) return Object.assign(structuredClone(EJEMPLO), JSON.parse(t)); } catch(e){}
  primeraVez = true;
  return structuredClone(EJEMPLO);
}
function guardar(){ try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch(e){} }

/* ============================================================
   Catálogo de módulos (el orden es el de montaje)
   ============================================================ */
const CATALOGO = [
  { id: "subredes", nombre: "Diseñador de subredes", cat: "Base", os: ["win","lin"], desc: "Calcula qué red necesitas según tus equipos, divide una red en subredes (VLSM o partes iguales) y te recomienda la IP de cada sitio. Genera VLAN para Cisco y los ámbitos DHCP.", pro: null },
  { id: "ip", nombre: "IP estática", cat: "Base", os: ["win","lin"], desc: "IP fija, puerta de enlace, DNS y nombre del equipo.", pro: "Zona horaria, hora por NTP, actualizaciones automáticas, RDP con NLA y SMBv1 desactivado." },
  { id: "ad", nombre: "Active Directory", cat: "Directorio", os: ["win","lin"], desc: "Crea el dominio, carga usuarios desde un CSV y une clientes Windows y Ubuntu.", pro: "OUs por niveles, papelera de AD, equipos nuevos en su OU, hora oficial del ROA y segundo controlador de dominio." },
  { id: "dns", nombre: "DNS", cat: "Red", os: ["win","lin"], desc: "Zona directa e inversa, registros A, CNAME y MX, y reenviadores.", pro: "Servidor secundario, transferencias restringidas, limpieza de registros, limitación de respuestas y log de consultas." },
  { id: "dhcp", nombre: "DHCP", cat: "Red", os: ["win","lin"], desc: "Ámbito, opciones para los clientes y reservas por MAC.", pro: "Conmutación por error con un segundo servidor, detección de conflictos y registro en el DNS." },
  { id: "gpo", nombre: "Directivas de grupo", cat: "Directorio", os: ["win"], requiere: "ad", desc: "Política de contraseñas y las GPO típicas: panel de control, CMD, USB y fondo.", pro: "Bloqueo de cuentas, política más dura para administradores, firma SMB, sin LLMNR y bloqueo de pantalla." },
  { id: "ficheros", nombre: "Servidor de ficheros", cat: "Servicios", os: ["win","lin"], desc: "Una carpeta compartida por departamento con sus permisos (SMB en Windows, Samba en Ubuntu).", pro: "Modelo AGDLP, solo ves lo que puedes abrir, cifrado SMB, cuotas, instantáneas y papelera de red." },
  { id: "web", nombre: "Servidor web", cat: "Servicios", os: ["win","lin"], desc: "Sitio de intranet con IIS o Apache y su nombre en el DNS.", pro: "HTTPS con redirección, cabeceras de seguridad y versión del servidor oculta." },
  { id: "ftp", nombre: "Servidor FTP", cat: "Servicios", os: ["win","lin"], desc: "FTP con usuarios locales encerrados en su carpeta (IIS FTP / vsftpd).", pro: "FTPS obligatorio, puertos pasivos fijos y solo los usuarios permitidos." },
  { id: "ssh", nombre: "SSH", cat: "Servicios", os: ["win","lin"], desc: "Administración remota por terminal con OpenSSH.", pro: "Solo claves, sin root, grupo permitido, Fail2ban y un seguro para no quedarte fuera." },
  { id: "firewall", nombre: "Cortafuegos", cat: "Seguridad", os: ["win","lin"], desc: "Abre solo los puertos de los servicios que has elegido.", pro: "Administración solo desde la red de gestión, límite de intentos y registro de lo bloqueado." },
  { id: "backup", nombre: "Copias de seguridad", cat: "Operación", os: ["win","lin"], desc: "Copia diaria de las carpetas importantes, con rotación.", pro: "Copias incrementales programadas, estado del sistema y réplica fuera del servidor (regla 3-2-1)." },
  { id: "verificar", nombre: "Verificación", cat: "Operación", os: ["win","lin"], desc: "Un script que comprueba todo lo montado y marca en rojo lo que falla.", pro: "Añade las comprobaciones de todo lo del modo profesional." },
  { id: "errores", nombre: "Diagnóstico de errores", cat: "Herramientas", os: ["win","lin"], desc: "Pega un error y te dice qué significa, por qué pasa y cómo arreglarlo. Revisa tus ficheros y los compara con los generados.", pro: null },
  { id: "chuleta", nombre: "Chuleta Win ↔ Linux", cat: "Herramientas", os: ["win","lin"], desc: "Los mismos comandos en los dos sistemas, con buscador.", pro: null }
];
const CATS = ["Base", "Red", "Directorio", "Servicios", "Seguridad", "Operación", "Herramientas"];
const has = id => S.modulos.includes(id);
const PRO = () => S.nivel === "pro";
const activos = () => [...(has("subredes") ? ["subredes"] : []), "red", ...CATALOGO.map(m => m.id).filter(id => id !== "subredes" && has(id))];
const num = id => String(activos().indexOf(id) + 1).padStart(2, "0");
const fich = (id, base, ext, suf = "") => `${num(id)}${suf}-${base}.${ext}`;
const usaSrv2 = () => PRO() && (has("dhcp") && S.dhcpFailover || has("dns") || has("ad"));

/* ============================================================
   Utilidades de red y texto
   ============================================================ */
function ipToInt(ip){
  const p = String(ip ?? "").trim().split(".");
  if (p.length !== 4) return null;
  let n = 0;
  for (const x of p){ if (!/^\d{1,3}$/.test(x)) return null; const v = +x; if (v > 255) return null; n = n * 256 + v; }
  return n;
}
const intToIp = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join(".");
const maskInt = p => p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0;
const MAC_RE = /^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$/;
const NOMBRE_RE = /^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$/;
function derivar(){
  const p = parseInt(S.prefijo, 10), red = ipToInt(S.red);
  if (red === null || !(p >= 8 && p <= 30)) return { ok: false };
  const mask = maskInt(p), netAddr = (red & mask) >>> 0, size = 2 ** (32 - p), bcast = netAddr + size - 1;
  return {
    ok: true, p, mask, netAddr, size, bcast,
    redTxt: intToIp(netAddr), maskTxt: intToIp(mask), bcastTxt: intToIp(bcast),
    primero: intToIp(netAddr + 1), ultimo: intToIp(bcast - 1), hosts: size - 2, cidr: intToIp(netAddr) + "/" + p,
    dentro: ip => { const n = ipToInt(ip); return n !== null && n > netAddr && n < bcast; }
  };
}
function zonaInversa(d){
  const o = d.redTxt.split("."), n = d.p >= 24 ? 3 : d.p >= 16 ? 2 : 1, base = o.slice(0, n);
  return {
    n, nombre: base.slice().reverse().join(".") + ".in-addr.arpa",
    networkId: base.concat(Array(4 - n).fill("0")).join(".") + "/" + (n * 8),
    fichero: "/etc/bind/db." + base.join("."),
    contiene: ip => String(ip).split(".").slice(0, n).join(".") === base.join("."),
    etiqueta: ip => String(ip).split(".").slice(n).reverse().join(".")
  };
}
const lista = s => String(s ?? "").split(/[,;]+/).map(x => x.trim()).filter(Boolean);
const forwarders = () => String(S.forwarders).split(/[\s,;]+/).filter(Boolean);
const host = () => String(S.srvNombre).toLowerCase();
const host2 = () => String(S.srv2Nombre).toLowerCase();
const fqdn = () => host() + "." + S.dominio;
const fqdn2 = () => host2() + "." + S.dominio;
const webFqdn = () => String(S.webHost).toLowerCase() + "." + S.dominio;
const dn = () => "DC=" + String(S.dominio).split(".").join(",DC=");
const NB = () => limpio(S.netbios).toUpperCase();
const limpio = s => String(s ?? "").replace(/[`"$'\\]/g, "").trim();
const ruta = s => String(s ?? "").replace(/[`"$']/g, "").trim();
const ascii = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const macWin = m => String(m).toUpperCase().replace(/:/g, "-");
const macLin = m => String(m).toLowerCase().replace(/-/g, ":");
const dnsClientes = () => (has("dns") || has("ad")) ? [S.srvIp, ...(usaSrv2() && (has("dns") || has("ad")) ? [S.srv2Ip] : [])] : forwarders();
const hoySerial = () => { const d = new Date(); return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0") + "01"; };
const L = (...xs) => xs.flat(Infinity).join("\n");
const PROsec = t => ["", `# ── PRO · ${t} ──`];
const ufwSi = cmd => `if ufw status | grep -q "Status: active"; then ${cmd}; fi`;

/* CSV de usuarios (lo usan AD, ficheros y verificación) */
function parseCSV(){
  const lineas = String(S.csv || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const errores = [], usuarios = [];
  if (!lineas.length) return { usuarios, errores: ["El CSV de usuarios está vacío."] };
  const sep = lineas[0].includes(";") ? ";" : ",";
  const cab = lineas[0].split(sep).map(c => ascii(c).toLowerCase().trim());
  const tieneCab = cab.some(c => ["nombre","apellidos","apellido","departamento","usuario"].includes(c));
  const idx = k => cab.findIndex(c => k.includes(c));
  const iN = tieneCab ? idx(["nombre"]) : 0, iA = tieneCab ? idx(["apellidos","apellido"]) : 1,
        iD = tieneCab ? idx(["departamento","depto"]) : 2, iU = tieneCab ? idx(["usuario","login"]) : 3;
  const usados = new Set();
  lineas.slice(tieneCab ? 1 : 0).forEach((l, k) => {
    const c = l.split(sep).map(x => x.trim());
    const nombre = limpio(c[iN]), apellidos = limpio(c[iA]), depto = limpio(c[iD]) || "General";
    if (!nombre || !apellidos){ errores.push(`CSV, línea ${k + (tieneCab ? 2 : 1)}: falta el nombre o los apellidos.`); return; }
    let u = iU >= 0 ? ascii(limpio(c[iU])).toLowerCase().replace(/[^a-z0-9._-]/g, "") : "";
    if (!u) u = (ascii(nombre)[0] + ascii(apellidos.split(/\s+/)[0])).toLowerCase().replace(/[^a-z0-9]/g, "");
    u = u.slice(0, 20);
    const base = u; let n = 2;
    while (usados.has(u)) u = base.slice(0, 19 - String(n).length) + n++;
    usados.add(u);
    usuarios.push({ nombre, apellidos, depto, usuario: u });
  });
  return { usuarios, errores };
}
const grupoDe = dep => "G_" + ascii(dep).replace(/[^A-Za-z0-9]+/g, "_");
const departamentos = () => [...new Set(parseCSV().usuarios.map(u => u.depto))];
function carpetas(){
  const deps = has("ad") ? departamentos() : lista(S.carpetas);
  const out = deps.map(dep => ({ nombre: ascii(dep).replace(/[^A-Za-z0-9]+/g, "_"), etiqueta: dep, grupo: grupoDe(dep), linux: ascii(dep).toLowerCase().replace(/[^a-z0-9]+/g, "") || "grupo" }));
  if (S.comun) out.push({ nombre: "Comun", etiqueta: "Común", grupo: null, linux: "comun" });
  return out;
}

/* ============================================================
   Validación del proyecto
   ============================================================ */
function validar(){
  const out = [];
  const add = (nivel, modulo, texto, campo) => out.push({ nivel, modulo, texto, campo });
  const d = derivar();
  if (ipToInt(S.red) === null) add("err", "red", "La dirección de red no es una IPv4 válida.", "red");
  const p = parseInt(S.prefijo, 10);
  if (!(p >= 8 && p <= 30)) add("err", "red", "El prefijo tiene que estar entre /8 y /30.", "prefijo");
  if (!d.ok) return out;
  if (ipToInt(S.red) !== d.netAddr) add("err", "red", `${S.red} no es una dirección de red para /${d.p}. ¿Querías decir ${d.redTxt}?`, "red");
  if (!d.dentro(S.gw)) add("err", "red", `La puerta de enlace ${S.gw} no es un host válido de ${d.cidr}.`, "gw");
  if (!d.dentro(S.srvIp)) add("err", "red", `La IP del servidor ${S.srvIp} no es un host válido de ${d.cidr}.`, "srvIp");
  if (S.srvIp === S.gw) add("err", "red", "El servidor y la puerta de enlace tienen la misma IP.", "srvIp");
  if (!/^[A-Za-z0-9-]{1,15}$/.test(S.srvNombre)) add("err", "red", "El nombre del servidor debe tener de 1 a 15 caracteres (letras, números y guiones). Es el límite NetBIOS de Windows.", "srvNombre");
  if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(S.dominio)) add("err", "red", "El dominio debe tener al menos dos partes, por ejemplo empresa.local.", "dominio");
  else if (/\.local$/i.test(S.dominio)) add("tip", "red", "En clase se usa .local, pero en una empresa se recomienda un subdominio de un dominio real (ad.empresa.com): .local choca con mDNS en Linux y macOS.", "dominio");
  if (has("ad") && !/^[A-Za-z0-9-]{1,15}$/.test(S.netbios)) add("err", "ad", "El nombre NetBIOS del dominio debe tener como máximo 15 caracteres.", "netbios");
  forwarders().forEach(f => { if (ipToInt(f) === null) add("err", "red", `El reenviador «${f}» no es una IP válida.`, "forwarders"); });
  const a = ipToInt(S.dhcpIni), b = ipToInt(S.dhcpFin);
  const enPool = ip => { const n = ipToInt(ip); return has("dhcp") && n !== null && a !== null && b !== null && n >= a && n <= b; };
  if (usaSrv2()){
    if (!d.dentro(S.srv2Ip)) add("err", "red", `La IP del segundo servidor (${S.srv2Ip}) no es un host válido de ${d.cidr}.`, "srv2Ip");
    if ([S.srvIp, S.gw].includes(S.srv2Ip)) add("err", "red", "El segundo servidor repite la IP del servidor principal o de la puerta de enlace.", "srv2Ip");
    if (enPool(S.srv2Ip)) add("err", "dhcp", "La IP del segundo servidor está dentro del rango DHCP.", "srv2Ip");
    if (!/^[A-Za-z0-9-]{1,15}$/.test(S.srv2Nombre) || S.srv2Nombre.toLowerCase() === host()) add("err", "red", "El segundo servidor necesita un nombre propio de 1 a 15 caracteres.", "srv2Nombre");
  }
  if (PRO() && (has("ssh") || has("firewall"))){
    const [ipn, pre] = String(S.adminNet).split("/");
    if (ipToInt(ipn) === null || !(+pre >= 8 && +pre <= 32)) add("err", "red", "La red de administración debe tener el formato 192.168.10.0/24.", "adminNet");
  }
  if (has("dhcp")){
    if (!d.dentro(S.dhcpIni)) add("err", "dhcp", `El inicio del rango DHCP (${S.dhcpIni}) está fuera de la red.`, "dhcpIni");
    if (!d.dentro(S.dhcpFin)) add("err", "dhcp", `El final del rango DHCP (${S.dhcpFin}) está fuera de la red.`, "dhcpFin");
    if (a !== null && b !== null && a > b) add("err", "dhcp", "El rango DHCP empieza después de donde acaba.", "dhcpIni");
    if (enPool(S.gw)) add("err", "dhcp", "La puerta de enlace está dentro del rango DHCP: se la podría dar a un cliente.", "dhcpIni");
    if (enPool(S.srvIp)) add("err", "dhcp", "La IP del servidor está dentro del rango DHCP: se la podría dar a un cliente.", "dhcpIni");
    const vistas = new Set();
    S.reservas.forEach((r, i) => {
      const n = r.nombre || `reserva ${i+1}`;
      if (!MAC_RE.test(r.mac)) add("err", "dhcp", `${n}: la MAC «${r.mac}» no tiene el formato 00:11:22:33:44:55.`);
      if (!d.dentro(r.ip)) add("err", "dhcp", `${n}: la IP ${r.ip} está fuera de la red.`);
      else if (enPool(r.ip)) add("warn", "dhcp", `${n}: la IP reservada ${r.ip} está dentro del rango dinámico. Funciona, pero es más limpio dejarla fuera.`);
      if ([S.gw, S.srvIp].includes(r.ip)) add("err", "dhcp", `${n}: la IP ${r.ip} ya la usa la puerta de enlace o el servidor.`);
      if (vistas.has(r.ip)) add("err", "dhcp", `La IP ${r.ip} está reservada dos veces.`);
      vistas.add(r.ip);
    });
  }
  if (has("dns")){
    S.registros.forEach(r => {
      if (!(r.nombre === "@" || NOMBRE_RE.test(r.nombre))) add("err", "dns", `El nombre de registro «${r.nombre}» no es válido.`);
      if (r.tipo === "A" && ipToInt(r.valor) === null) add("err", "dns", `${r.nombre}: «${r.valor}» no es una IP válida.`);
      if (r.tipo === "A" && [host(), host2()].includes(String(r.nombre).toLowerCase())) add("warn", "dns", `El registro A de ${r.nombre} ya lo crea el script automáticamente.`);
      if (r.tipo !== "A" && !String(r.valor).trim()) add("err", "dns", `${r.nombre}: falta el destino del registro ${r.tipo}.`);
    });
  }
  if (has("ad")) parseCSV().errores.forEach(e => add("warn", "ad", e));
  if (has("web")){
    if (!NOMBRE_RE.test(S.webHost)) add("err", "web", "El nombre del sitio web debe ser una sola palabra (intranet, www...).", "webHost");
    else if ((has("dns")) && !S.registros.some(r => String(r.nombre).toLowerCase() === String(S.webHost).toLowerCase()) && ![host(), host2()].includes(String(S.webHost).toLowerCase()))
      add("warn", "web", `${webFqdn()} no existe en el DNS. Añade en el módulo DNS un registro CNAME ${S.webHost} → ${host()}.`);
  }
  if (has("ssh") && !(+S.sshPuerto >= 1 && +S.sshPuerto <= 65535)) add("err", "ssh", "El puerto SSH debe estar entre 1 y 65535.", "sshPuerto");
  if (has("ftp") && PRO() && !(+S.pasvMin >= 1024 && +S.pasvMax > +S.pasvMin && +S.pasvMax <= 65535)) add("err", "ftp", "El rango de puertos pasivos no es válido (por ejemplo 50000-50100).", "pasvMin");
  if (has("ficheros") && !carpetas().length) add("err", "ficheros", "No hay ninguna carpeta que compartir.", "carpetas");
  if (has("gpo") && S.gpoFondo && !String(S.fondoRuta).startsWith("\\\\")) add("warn", "gpo", "La ruta del fondo debería ser una ruta de red (\\\\servidor\\carpeta\\fondo.jpg) para que la vean todos los equipos.", "fondoRuta");
  if (has("backup") && !/^([01]?\d|2[0-3]):[0-5]\d$/.test(S.bkHora)) add("err", "backup", "La hora de la copia debe tener el formato 21:00.", "bkHora");
  return out;
}

const nivelTxt = () => PRO() ? "nivel profesional" : "nivel clase";

  "#!/usr/bin/env bash",
  "# ==================================================",
  `# ${titulo}`,
  `# Proyecto: ${S.dominio} · ${S.red}/${S.prefijo} · ${host()} (${S.srvIp}) · ${nivelTxt()}`,

);
const certPS = (nombre, variable = "$cert") => [
  `# Certificado autofirmado para ${nombre} (en Internet usa uno de una CA, por ejemplo con win-acme)`,
  `${variable} = Get-ChildItem Cert:\\LocalMachine\\My | Where-Object { $_.Subject -eq "CN=${nombre}" } | Select-Object -First 1`,
  `if (-not ${variable}) {`,
  `    ${variable} = New-SelfSignedCertificate -DnsName "${nombre}" -CertStoreLocation "Cert:\\LocalMachine\\My" -NotAfter (Get-Date).AddYears(2)`,
  "}"
];
const certSH = (nombre, crt, key) => [
  `# Certificado autofirmado para ${nombre} (en Internet usa certbot / Let's Encrypt)`,
  `if [ ! -f ${crt} ]; then`,
  `  openssl req -x509 -nodes -days 825 -newkey rsa:2048 -keyout ${key} -out ${crt} \\`,
  `    -subj "/CN=${nombre}" -addext "subjectAltName=DNS:${nombre}"`,
  `  chmod 600 ${key}`,
  "fi"
];

   DHCP
   ============================================================ */
function dhcpWindows(d, f){
  const out = [cabeceraPS("Servidor DHCP en Windows Server", f),
    "# Instala el rol DHCP con sus herramientas de administración",
    "Install-WindowsFeature DHCP -IncludeManagementTools",
    "",
    "# Crea los grupos locales «Administradores de DHCP» y «Usuarios de DHCP»",
    "Add-DhcpServerSecurityGroup",
    "Restart-Service DHCPServer",
    ""];
  if (has("ad")) out.push(
    "# Autoriza el servidor DHCP en Active Directory.",
    "# Sin esto, en un dominio el servicio no reparte IPs.",
    "if (-not (Get-DhcpServerInDC | Where-Object IPAddress -eq \"" + S.srvIp + "\")) {",
    `    Add-DhcpServerInDC -DnsName "${fqdn()}" -IPAddress ${S.srvIp}`,
    "}", "");
  out.push(
    "# Quita el aviso de «configuración pendiente» del Administrador del servidor",
    "Set-ItemProperty -Path HKLM:\\SOFTWARE\\Microsoft\\ServerManager\\Roles\\12 -Name ConfigurationState -Value 2",
    "",
    `# Crea el ámbito ${d.cidr} si no existe todavía`,
    `if (-not (Get-DhcpServerv4Scope -ScopeId ${d.redTxt} -ErrorAction SilentlyContinue)) {`,
    "    $ambito = @{",
    `        Name          = "LAN ${d.redTxt}"`,
    `        StartRange    = "${S.dhcpIni}"`,
    `        EndRange      = "${S.dhcpFin}"`,
    `        SubnetMask    = "${d.maskTxt}"`,
    `        LeaseDuration = (New-TimeSpan -Hours ${+S.lease || 8})`,
    '        State         = "Active"',
    "    }",
    "    Add-DhcpServerv4Scope @ambito",
    "}",
    "",
    "# Opciones que reciben los clientes: puerta de enlace (003), DNS (006) y dominio (015).",
    "# -Force evita que falle si el DNS todavía no está instalado.",
    `Set-DhcpServerv4OptionValue -ScopeId ${d.redTxt} -Router ${S.gw} -DnsServer ${dnsClientes().join(",")} -DnsDomain "${S.dominio}" -Force`
  );
  if (S.reservas.length){
    out.push("", "# Reservas: siempre la misma IP para la misma MAC");
    S.reservas.forEach(r => out.push(
      `if (-not (Get-DhcpServerv4Reservation -IPAddress ${r.ip} -ErrorAction SilentlyContinue)) {`,
      `    Add-DhcpServerv4Reservation -ScopeId ${d.redTxt} -IPAddress ${r.ip} -ClientId "${macWin(r.mac)}" -Name "${limpio(r.nombre)}"`,
      "}"));
  }
  if (PRO()){
    out.push(...PROsec("Registro en DNS y detección de conflictos"),
      "# El DHCP da de alta y de baja en el DNS los nombres de los clientes",
      "Set-DhcpServerv4DnsSetting -DynamicUpdates Always -DeleteDnsRRonLeaseExpiry $true",
      "# Antes de entregar una IP hace ping para comprobar que nadie la usa",
      "Set-DhcpServerSetting -ConflictDetectionAttempts 1");
    if (S.dhcpFailover) out.push(...PROsec(`Conmutación por error con ${S.srv2Nombre} (reparto 50/50)`),
      `# Requisito: ${S.srv2Nombre} (${S.srv2Ip}) con el rol DHCP instalado${has("ad") ? " y autorizado en AD" : ""}.`,
      "# El ámbito, las opciones y las reservas se copian solos al compañero.",
      'if (-not (Get-DhcpServerv4Failover -Name "failover-lan" -ErrorAction SilentlyContinue)) {',
      '    $secreto = Read-Host "Secreto compartido entre los dos servidores DHCP"',
      "    $failover = @{",
      '        Name                = "failover-lan"',
      `        PartnerServer       = "${fqdn2()}"`,
      `        ScopeId             = "${d.redTxt}"`,
      "        LoadBalancePercent  = 50",
      "        MaxClientLeadTime   = (New-TimeSpan -Hours 1)",
      "        AutoStateTransition = $true",
      "        StateSwitchInterval = (New-TimeSpan -Hours 1)",
      "        SharedSecret        = $secreto",
      "    }",
      "    Add-DhcpServerv4Failover @failover",
      "}");
  }
  out.push("", "# Muestra el resultado",
    `Get-DhcpServerv4Scope -ScopeId ${d.redTxt} | Format-List Name, StartRange, EndRange, SubnetMask, State`,
    `Get-DhcpServerv4OptionValue -ScopeId ${d.redTxt}`);
  return L(out);
}

function registrosDNS(){
  const vistos = new Set([host() + "|A", ...(usaSrv2() ? [host2() + "|A"] : [])]);
  return S.registros.filter(r => {
    const k = String(r.nombre).toLowerCase() + "|" + r.tipo;
    if (vistos.has(k) && r.tipo !== "MX") return false;
    vistos.add(k); return true;
  });
}
function destinoFQDN(v){ v = String(v).trim(); if (v.endsWith(".")) return v.slice(0, -1); return v.includes(".") ? v : `${v}.${S.dominio}`; }
const destinoBind = v => { v = String(v).trim(); return v.includes(".") ? (v.endsWith(".") ? v : v + ".") : v; };
function dnsWindows(d, f){
  const z = zonaInversa(d), zona = S.dominio, ad = has("ad"), s2 = usaSrv2();
  const almac = ad ? '-ReplicationScope "Domain" -DynamicUpdate Secure' : null;
  const A = (n, ip, ptr) => [
    `if (-not (Get-DnsServerResourceRecord -ZoneName "${zona}" -Name "${n}" -RRType A -ErrorAction SilentlyContinue)) {`,
    `    Add-DnsServerResourceRecordA -ZoneName "${zona}" -Name "${n}" -IPv4Address ${ip}${ptr ? " -CreatePtr" : ""}`, "}"];
  const out = [cabeceraPS("Servidor DNS en Windows Server", f),
    `# Instala el rol DNS${ad ? " (si ya creaste el dominio, ya está instalado y no hace nada)" : ""}`,
    "Install-WindowsFeature DNS -IncludeManagementTools",
    "",
    ad ? "# Zonas integradas en Active Directory: se replican solas a los demás controladores de dominio"
       : "# Zonas guardadas en fichero (C:\\Windows\\System32\\dns)",
    "# Zona directa: nombre -> IP",
    `if (-not (Get-DnsServerZone -Name "${zona}" -ErrorAction SilentlyContinue)) {`,
    `    Add-DnsServerPrimaryZone -Name "${zona}" ${almac || `-ZoneFile "${zona}.dns"`}`,
    "}",
    "",
    `# Zona inversa: IP -> nombre${d.p % 8 ? ` (se crea como /${z.n*8}, porque las zonas inversas van por octetos)` : ""}`,
    `if (-not (Get-DnsServerZone -Name "${z.nombre}" -ErrorAction SilentlyContinue)) {`,
    `    Add-DnsServerPrimaryZone -NetworkId "${z.networkId}" ${almac || `-ZoneFile "${z.nombre}.dns"`}`,
    "}",
    "",
    "# Registro A del servidor con su PTR en la zona inversa",
    ...A(host(), S.srvIp, true),
    s2 ? [`# Registro del segundo servidor (${S.srv2Nombre})`, ...A(host2(), S.srv2Ip, true)] : []];
  const regs = registrosDNS();
  if (regs.length) out.push("", "# Resto de registros del proyecto");
  regs.forEach(r => {
    const n = limpio(r.nombre);
    if (r.tipo === "A") out.push(...A(n, r.valor, z.contiene(r.valor)));
    else if (r.tipo === "CNAME") out.push(
      `if (-not (Get-DnsServerResourceRecord -ZoneName "${zona}" -Name "${n}" -RRType CName -ErrorAction SilentlyContinue)) {`,
      `    Add-DnsServerResourceRecordCName -ZoneName "${zona}" -Name "${n}" -HostNameAlias "${destinoFQDN(r.valor)}"`, "}");
    else if (r.tipo === "MX") out.push(`# Correo: los mensajes para @${zona} van a ${destinoFQDN(r.valor)} (prioridad 10)`,
      `if (-not (Get-DnsServerResourceRecord -ZoneName "${zona}" -Name "${n}" -RRType MX -ErrorAction SilentlyContinue)) {`,
      `    Add-DnsServerResourceRecordMX -ZoneName "${zona}" -Name "${n === "@" ? "." : n}" -MailExchange "${destinoFQDN(r.valor)}" -Preference 10`, "}");
  });
  out.push("", "# Reenviadores: lo que el servidor no conoce lo pregunta fuera",
    `Set-DnsServerForwarder -IPAddress ${forwarders().join(",")}`);
  if (PRO()){
    out.push(...PROsec("Limpieza de registros caducados (scavenging)"),
      "# Borra los registros dinámicos de equipos que llevan más de 14 días sin renovarse",
      "Set-DnsServerScavenging -ScavengingState $true -ScavengingInterval 7.00:00:00 -RefreshInterval 7.00:00:00 -NoRefreshInterval 7.00:00:00 -ApplyOnAllZones",
      ...PROsec("Transferencias de zona"),
      ad ? ["# Con AD las zonas se replican por el propio dominio: no se permite transferirlas a nadie",
            `Set-DnsServerPrimaryZone -Name "${zona}" -SecureSecondaries NoTransfer`,
            `Set-DnsServerPrimaryZone -Name "${z.nombre}" -SecureSecondaries NoTransfer`]
         : [`# Solo ${S.srv2Nombre} (${S.srv2Ip}) puede copiar las zonas, y se le avisa de cada cambio`,
            `Set-DnsServerPrimaryZone -Name "${zona}" -SecureSecondaries TransferToSecureServers -SecondaryServers ${S.srv2Ip} -Notify NotifyServers -NotifyServers ${S.srv2Ip}`,
            `Set-DnsServerPrimaryZone -Name "${z.nombre}" -SecureSecondaries TransferToSecureServers -SecondaryServers ${S.srv2Ip} -Notify NotifyServers -NotifyServers ${S.srv2Ip}`,
            "# Añade el secundario como servidor de nombres (NS) de las zonas",
            `Add-DnsServerResourceRecord -ZoneName "${zona}" -NS -Name "@" -NameServer "${fqdn2()}" -ErrorAction SilentlyContinue`,
            `Add-DnsServerResourceRecord -ZoneName "${z.nombre}" -NS -Name "@" -NameServer "${fqdn2()}" -ErrorAction SilentlyContinue`],
      ...PROsec("Limitación de respuestas (frena ataques de amplificación DNS)"),
      "Set-DnsServerResponseRateLimiting -Mode Enable -Force");
  }
  out.push("", "# Prueba rápida contra el propio servidor",
    `Resolve-DnsName ${fqdn()} -Server 127.0.0.1`,
    `Resolve-DnsName ${S.srvIp} -Server 127.0.0.1`);
  return L(out);
}
function dnsWindowsSecundario(d, f){
  const z = zonaInversa(d);
  return L(cabeceraPS(`DNS secundario en ${S.srv2Nombre}`, f),
    `# Se ejecuta en ${S.srv2Nombre} (${S.srv2Ip}), con IP fija ya puesta`,

    "}",

function dnsLinux(d, f){
  const z = zonaInversa(d), zona = S.dominio, s2 = usaSrv2() && PRO();
  const pad = s => String(s).padEnd(16, " ");
  const soa = [
    "$TTL    86400",
    `@       IN      SOA     ${fqdn()}. admin.${zona}. (`,
    `                        ${hoySerial()} ; Serie (súbelo cada vez que cambies la zona)`,
    "                        3600       ; Refresh", "                        1800       ; Retry",
    "                        604800     ; Expire", "                        86400 )    ; TTL negativo",
    `@       IN      NS      ${fqdn()}.`,
    ...(s2 ? [`@       IN      NS      ${fqdn2()}.`] : [])];
  const regs = registrosDNS();
  const directa = [...soa, `${pad(host())}IN      A       ${S.srvIp}`, ...(s2 ? [`${pad(host2())}IN      A       ${S.srv2Ip}`] : [])];
  regs.forEach(r => {
    const v = String(r.valor).trim();
    if (r.tipo === "A") directa.push(`${pad(r.nombre)}IN      A       ${v}`);
    if (r.tipo === "CNAME") directa.push(`${pad(r.nombre)}IN      CNAME   ${destinoBind(v)}`);
    if (r.tipo === "MX") directa.push(`${pad(r.nombre)}IN      MX      10 ${destinoBind(v)}`);
  });
  const inversa = [...soa, `${pad(z.etiqueta(S.srvIp))}IN      PTR     ${fqdn()}.`, ...(s2 ? [`${pad(z.etiqueta(S.srv2Ip))}IN      PTR     ${fqdn2()}.`] : [])];
  regs.filter(r => r.tipo === "A" && z.contiene(r.valor)).forEach(r => inversa.push(`${pad(z.etiqueta(r.valor))}IN      PTR     ${r.nombre}.${zona}.`));
  const extra = s2 ? [`    allow-transfer { ${S.srv2Ip}; };`, `    also-notify { ${S.srv2Ip}; };`, "    notify yes;"] : [];
  return L(cabeceraSH("Servidor DNS en Ubuntu (BIND9)", f),
    "# Instala BIND9 y las herramientas de prueba (dig, named-checkzone...)",
    "apt-get update",
    "DEBIAN_FRONTEND=noninteractive apt-get install -y bind9 bind9utils bind9-dnsutils",
    "",
    "# Copia de seguridad de la configuración original (solo la primera vez)",
    "for f in named.conf.options named.conf.local; do",
    '  [ -f "/etc/bind/$f.orig" ] || cp "/etc/bind/$f" "/etc/bind/$f.orig"',
    "done",
    PRO() ? ["", "# Carpeta para el registro de consultas (AppArmor ya permite /var/log/named)", "mkdir -p /var/log/named", "chown bind:bind /var/log/named"] : [],
    "",
    "# Opciones generales: reenviadores y quién puede preguntar",
    "cat > /etc/bind/named.conf.options <<'EOF'",
    "options {",
    '    directory "/var/cache/bind";',
    `    forwarders { ${forwarders().map(x => x + ";").join(" ")} };`,
    "    dnssec-validation auto;",
    "    listen-on-v6 { any; };",
    "    recursion yes;",
    `    allow-query { localhost; ${d.cidr}; };`,
    `    allow-recursion { localhost; ${d.cidr}; };`,
    PRO() ? ["",
      "    # ── PRO · Endurecimiento ──",
      "    # Nadie puede copiar las zonas salvo que se permita en cada zona",
      "    allow-transfer { none; };",
      "    # No dice qué versión de BIND usa",
      '    version "no disponible";',
      "    # Limita respuestas repetidas (frena ataques de amplificación)",
      "    rate-limit { responses-per-second 10; };"] : [],
    "};",
    PRO() ? ["",
      "# ── PRO · Registro de consultas, con rotación ──",
      "logging {",
      '    channel consultas { file "/var/log/named/consultas.log" versions 5 size 20m; print-time yes; };',
      "    category queries { consultas; };",
      "};"] : [],
    "EOF",
    "",
    "# Declara las dos zonas: directa e inversa",
    "cat > /etc/bind/named.conf.local <<'EOF'",
    `zone "${zona}" {`, "    type master;", `    file "/etc/bind/db.${zona}";`, ...extra, "};",
    "",
    `zone "${z.nombre}" {`, "    type master;", `    file "${z.fichero}";`, ...extra, "};",
    "EOF",
    "",
    `# Zona directa ${zona}: nombre -> IP`,
    `cat > /etc/bind/db.${zona} <<'EOF'`, ...directa, "EOF",
    "",
    `# Zona inversa ${z.nombre}: IP -> nombre`,
    `cat > ${z.fichero} <<'EOF'`, ...inversa, "EOF",
    "",
    "# Comprueba la sintaxis de todo antes de reiniciar",
    "named-checkconf",
    `named-checkzone ${zona} /etc/bind/db.${zona}`,
    `named-checkzone ${z.nombre} ${z.fichero}`,
    "",
    "# Abre el puerto 53 si el cortafuegos está activo",
    ufwSi(PRO() ? `ufw allow from ${d.cidr} to any port 53` : "ufw allow 53"),
    "",
    "# Reinicia BIND (el servicio se llama named) y lo deja activado",
    "systemctl restart named",
    "systemctl enable named",
    "",
    "# Prueba rápida contra el propio servidor",
    `dig +short @127.0.0.1 ${fqdn()}`,
    `dig +short @127.0.0.1 -x ${S.srvIp}`
  );
}

    usuarios.map(u => `    @{ Nombre = "${u.nombre}";${" ".repeat(w - u.nombre.length)} Apellidos = "${u.apellidos}"; Usuario = "${u.usuario}"; Depto = "${u.depto}" }`).join("\n"),
    ")",
    "",
    "foreach ($u in $usuarios) {",
    "    if (Get-ADUser -Filter \"SamAccountName -eq '$($u.Usuario)'\" -ErrorAction SilentlyContinue) {",
    '        Write-Host "Ya existe, se salta: $($u.Usuario)" -ForegroundColor Yellow',
    "        continue",

    "    $dep = $u.Depto",
    "    $completo = \"$($u.Nombre) $($u.Apellidos)\"",
    "    $datos = @{",

    "        DisplayName           = $completo",
    "        GivenName             = $u.Nombre",
    "        Surname               = $u.Apellidos",
    "        SamAccountName        = $u.Usuario",

    "        Department            = $dep",
    "        AccountPassword       = $pass",
    "        Enabled               = $true",
    "        ChangePasswordAtLogon = $true",
    "    }",
    "    New-ADUser @datos",
    `    $grupo = ${PS_GRUPO}`,
    "    Add-ADGroupMember -Identity $grupo -Members $u.Usuario",
    '    Write-Host "Usuario creado: $($u.Usuario) -> $grupo" -ForegroundColor Green',
    "}");
  if (PRO()) out.push(...PROsec("Papelera de reciclaje de AD"),
    "# Permite recuperar usuarios u OUs borrados por error, con todos sus atributos (no se puede desactivar)",

  out.push("", "# Resumen de lo que hay en la OU de la empresa",

  return L(out);

    "#  - Que la hora coincida con la del servidor (Kerberos falla con más de 5 minutos de diferencia)",
    "",
    "# Paquetes necesarios",
    "apt-get update",
    "DEBIAN_FRONTEND=noninteractive apt-get install -y realmd sssd sssd-tools libnss-sss libpam-sss adcli samba-common-bin oddjob oddjob-mkhomedir packagekit",
    "",
    "# Comprueba que ve el dominio",
    `realm discover ${S.dominio}`,
    "",
    "# Une el equipo (pide la contraseña del Administrador del dominio)",
    PRO() ? `realm join -U Administrador --computer-ou="${ouEquipos()}" ${S.dominio}` : `realm join -U Administrador ${S.dominio}`,
    "",
    "# Crea la carpeta personal la primera vez que entra un usuario del dominio",
    "pam-auth-update --enable mkhomedir",
    "",
    "# Permite entrar con «usuario» en vez de «usuario@dominio»",
    "sed -i 's/^use_fully_qualified_names = True/use_fully_qualified_names = False/' /etc/sssd/sssd.conf",
    PRO() ? [...PROsec("Solo pueden entrar los grupos que digas"),
      "realm deny --all",
      ...departamentos().slice(0, 1).map(dep => `realm permit -g ${grupoDe(dep)}`),
      "# Añade más grupos con: realm permit -g NOMBRE_GRUPO"] : [],
    "systemctl restart sssd",
    "",
    "# Prueba: debe mostrar el usuario y sus grupos del dominio",
    `id ${u}`
  );
}
function adSegundoDC(f){

/* ============================================================
   Directivas de grupo (GPO)
   ============================================================ */
function gpoWindows(f){
  const out = [cabeceraPS("Directivas de grupo (GPO)", f),
    "Import-Module GroupPolicy",
    "Import-Module ActiveDirectory",
    "",
    `$dominio   = "${S.dominio}"`,
    `$ouUsuarios = "${ouUsuarios()}"`,
    `$ouEquipos  = "${ouEquipos()}"`,
    "",
    "# Crea la GPO si no existe y la vincula a su OU",
    "function Nueva-GPO([string]$Nombre, [string]$Destino) {",
    "    if (-not (Get-GPO -Name $Nombre -ErrorAction SilentlyContinue)) {",
    '        New-GPO -Name $Nombre -Comment "Creada con ASIRkit" | Out-Null',
    '        Write-Host "GPO creada: $Nombre" -ForegroundColor Green',
    "    }",
    "    if (-not ((Get-GPInheritance -Target $Destino).GpoLinks.DisplayName -contains $Nombre)) {",
    "        New-GPLink -Name $Nombre -Target $Destino | Out-Null",
    "    }",
    "}",
    "",
    "# Política de contraseñas del dominio (va en la Default Domain Policy, no en una GPO aparte)",
    PRO() ? [
      "$politica = @{",
      "    Identity                    = $dominio",
      "    MinPasswordLength           = 12",
      "    ComplexityEnabled           = $true",
      "    PasswordHistoryCount        = 24",
      "    MaxPasswordAge              = (New-TimeSpan -Days 180)",
      "    MinPasswordAge              = (New-TimeSpan -Days 1)",
      "    # ── PRO · Bloqueo de cuenta: 5 intentos fallidos = 15 minutos bloqueada",
      "    LockoutThreshold            = 5",
      "    LockoutDuration             = (New-TimeSpan -Minutes 15)",
      "    LockoutObservationWindow    = (New-TimeSpan -Minutes 15)",
      "}",
      "Set-ADDefaultDomainPasswordPolicy @politica"
    ] : "Set-ADDefaultDomainPasswordPolicy -Identity $dominio -MinPasswordLength 8 -ComplexityEnabled $true -PasswordHistoryCount 5 -MaxPasswordAge (New-TimeSpan -Days 90)"];
  if (PRO()) out.push(...PROsec("Política más dura solo para los administradores del dominio"),
    "# Directiva de contraseñas específica (PSO): 15 caracteres y bloqueo tras 3 intentos",
    "if (-not (Get-ADFineGrainedPasswordPolicy -Filter \"Name -eq 'PSO-Administradores'\")) {",
    "    $pso = @{",
    '        Name                        = "PSO-Administradores"',
    "        Precedence                  = 10",
    "        MinPasswordLength           = 15",
    "        ComplexityEnabled           = $true",
    "        PasswordHistoryCount        = 24",
    "        MaxPasswordAge              = (New-TimeSpan -Days 180)",
    "        MinPasswordAge              = (New-TimeSpan -Days 1)",
    "        LockoutThreshold            = 3",
    "        LockoutDuration             = (New-TimeSpan -Minutes 30)",
    "        LockoutObservationWindow    = (New-TimeSpan -Minutes 30)",
    "        ReversibleEncryptionEnabled = $false",
    "    }",
    "    New-ADFineGrainedPasswordPolicy @pso",
    "}",
    "# «Admins. del dominio» se busca por su SID (-512), así funciona en cualquier idioma",
    '$admins = Get-ADGroup -Identity "$((Get-ADDomain).DomainSID.Value)-512"',
    'Add-ADFineGrainedPasswordPolicySubject -Identity "PSO-Administradores" -Subjects $admins');
  const usr = [], eq = [];
  if (S.gpoPanel) usr.push("# Sin acceso al Panel de control ni a Configuración",
    '$r = @{ Name = $gUsr; Key = "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer"; ValueName = "NoControlPanel"; Type = "DWord"; Value = 1 }',
    "Set-GPRegistryValue @r | Out-Null");
  if (S.gpoCmd) usr.push("# Sin símbolo del sistema (2 = bloquea la consola, pero deja ejecutar scripts de inicio de sesión)",
    '$r = @{ Name = $gUsr; Key = "HKCU\\Software\\Policies\\Microsoft\\Windows\\System"; ValueName = "DisableCMD"; Type = "DWord"; Value = 2 }',
    "Set-GPRegistryValue @r | Out-Null");
  if (S.gpoFondo) usr.push("# Fondo de escritorio corporativo (4 = rellenar)",
    `$r = @{ Name = $gUsr; Key = "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System"; ValueName = "Wallpaper"; Type = "String"; Value = "${ruta(S.fondoRuta)}" }`,
    "Set-GPRegistryValue @r | Out-Null",
    '$r = @{ Name = $gUsr; Key = "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System"; ValueName = "WallpaperStyle"; Type = "String"; Value = "4" }',
    "Set-GPRegistryValue @r | Out-Null");
  if (S.gpoBloqueo) usr.push("# Bloqueo de pantalla con contraseña a los 10 minutos sin uso",
    'foreach ($v in @(@("ScreenSaveActive", "1"), @("ScreenSaverIsSecure", "1"), @("ScreenSaveTimeOut", "600"))) {',
    '    Set-GPRegistryValue -Name $gUsr -Key "HKCU\\Software\\Policies\\Microsoft\\Windows\\Control Panel\\Desktop" -ValueName $v[0] -Type String -Value $v[1] | Out-Null',
    "}");
  if (S.gpoUsb) eq.push("# Bloquea las memorias USB y demás almacenamiento extraíble",
    '$r = @{ Name = $gEq; Key = "HKLM\\Software\\Policies\\Microsoft\\Windows\\RemovableStorageDevices"; ValueName = "Deny_All"; Type = "DWord"; Value = 1 }',
    "Set-GPRegistryValue @r | Out-Null");
  if (PRO()) eq.push("# ── PRO · Firma SMB obligatoria: evita ataques de retransmisión (NTLM relay)",
    'Set-GPRegistryValue -Name $gEq -Key "HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanWorkstation\\Parameters" -ValueName "RequireSecuritySignature" -Type DWord -Value 1 | Out-Null',
    'Set-GPRegistryValue -Name $gEq -Key "HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters" -ValueName "RequireSecuritySignature" -Type DWord -Value 1 | Out-Null',
    "# ── PRO · Sin LLMNR: la herramienta Responder lo usa para robar credenciales en la red local",
    'Set-GPRegistryValue -Name $gEq -Key "HKLM\\Software\\Policies\\Microsoft\\Windows NT\\DNSClient" -ValueName "EnableMulticast" -Type DWord -Value 0 | Out-Null');
  if (usr.length) out.push("", `# GPO de usuario, vinculada a ${PRO() ? "la OU Usuarios" : "la OU de la empresa"}`,
    '$gUsr = "ASIRkit - Restricciones de usuario"', "Nueva-GPO $gUsr $ouUsuarios", ...usr);
  if (eq.length) out.push("", `# GPO de equipo, vinculada a ${PRO() ? "la OU Equipos" : "todo el dominio"}`,
    '$gEq = "ASIRkit - Seguridad de equipos"', "Nueva-GPO $gEq $ouEquipos", ...eq);
  out.push("", "# Informe en HTML de todas las GPO, en el escritorio",
    'Get-GPOReport -All -ReportType Html -Path "$env:USERPROFILE\\Desktop\\informe-gpo.html"',
    "",
    "# En los clientes se aplican al reiniciar o con: gpupdate /force");
  return L(out);
}

/* ============================================================
   Servidor de ficheros
   ============================================================ */
function ficherosWindows(f){
  const cs = carpetas(), ad = has("ad"), agdlp = PRO() && ad, base = ruta(S.rutaWin), unidad = base.slice(0, 2);
  const g = c => {
    if (!c.grupo) return ad ? (agdlp ? `${NB()}\\DL_Comun_M` : "*$((Get-ADDomain).DomainSID.Value)-513") : "*S-1-5-11";
    if (agdlp) return `${NB()}\\DL_${c.nombre}_M`;
    return ad ? `${NB()}\\${c.grupo}` : c.grupo;
  };
  const out = [cabeceraPS("Servidor de ficheros: carpetas compartidas por departamento", f),
    "# Rol de servidor de archivos",
    `Install-WindowsFeature FS-FileServer${PRO() ? ", FS-Resource-Manager" : ""} -IncludeManagementTools`,
    "",
    `$base = "${base}"`,
    "New-Item -ItemType Directory -Path $base -Force | Out-Null",
    "",
    "# «Usuarios autentificados» por su SID, para que funcione en cualquier idioma de Windows",
    '$autenticados = (New-Object System.Security.Principal.SecurityIdentifier "S-1-5-11").Translate([System.Security.Principal.NTAccount]).Value'];
  if (!ad) out.push("", "# Sin dominio: grupos locales por departamento (añade usuarios con Add-LocalGroupMember)",
    `foreach ($grupo in @(${cs.filter(c => c.grupo).map(c => `"${c.grupo}"`).join(", ")})) {`,
    "    if (-not (Get-LocalGroup -Name $grupo -ErrorAction SilentlyContinue)) { New-LocalGroup -Name $grupo | Out-Null }",
    "}");
  if (agdlp){
    out.push(...PROsec("Modelo AGDLP: usuarios → grupo Global → grupo Local de dominio → permiso"),
      "# Los permisos se dan a grupos DL_ (uno por carpeta y nivel de acceso), y los G_ de departamento se meten dentro.",
      "# Si mañana Ventas necesita leer Informática, se añade G_Ventas a un DL_ sin tocar ni un permiso NTFS.",
      `$rutaGrupos = "${ouGrupos()}"`,
      "$dl = @(",
      cs.map(c => `    @{ Nombre = "DL_${c.nombre}_M"; Miembro = ${c.grupo ? `"${c.grupo}"` : '"$((Get-ADDomain).DomainSID.Value)-513"'} }`).join("\n"),
      ")",
      "foreach ($x in $dl) {",
      "    if (-not (Get-ADGroup -Filter \"Name -eq '$($x.Nombre)'\" -ErrorAction SilentlyContinue)) {",
      '        New-ADGroup -Name $x.Nombre -GroupScope DomainLocal -GroupCategory Security -Path $rutaGrupos -Description "Modificar en $base"',
      "    }",
      "    Add-ADGroupMember -Identity $x.Nombre -Members (Get-ADGroup -Identity $x.Miembro)",
      "}");
  }
  out.push("", "# Carpetas: nombre del recurso y grupo con permiso de modificar",
    "$carpetas = @(",
    cs.map(c => `    @{ Nombre = "${c.nombre}"; Grupo = "${g(c)}" }`).join("\n"),
    ")",
    "",
    "foreach ($c in $carpetas) {",
    "    $ruta = Join-Path $base $c.Nombre",
    "    New-Item -ItemType Directory -Path $ruta -Force | Out-Null",
    "",
    "    # NTFS: quita la herencia y deja solo Administradores (S-1-5-32-544), SYSTEM (S-1-5-18) y el grupo",
    '    icacls $ruta /inheritance:r /grant:r "*S-1-5-32-544:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "$($c.Grupo):(OI)(CI)M" | Out-Null',
    "",
    "    # Recurso compartido: control total a los usuarios autentificados y quien manda es NTFS",
    "    if (-not (Get-SmbShare -Name $c.Nombre -ErrorAction SilentlyContinue)) {",
    PRO() ? [
    "        # ── PRO · Cada uno solo ve las carpetas que puede abrir, el tráfico va cifrado y sin caché sin conexión",
    "        New-SmbShare -Name $c.Nombre -Path $ruta -FullAccess $autenticados -FolderEnumerationMode AccessBased -EncryptData $true -CachingMode None | Out-Null"]
          : "        New-SmbShare -Name $c.Nombre -Path $ruta -FullAccess $autenticados | Out-Null",
    '        Write-Host "Compartida: \\\\$env:COMPUTERNAME\\$($c.Nombre)" -ForegroundColor Green',
    "    }",
    PRO() ? [
    "",
    `    # ── PRO · Cuota de ${+S.cuotaGB || 5} GB por carpeta`,
    "    if (-not (Get-FsrmQuota -Path $ruta -ErrorAction SilentlyContinue)) {",
    `        New-FsrmQuota -Path $ruta -Size ${+S.cuotaGB || 5}GB -Description "Cuota de ASIRkit" | Out-Null`,
    "    }"] : [],
    "}");
  if (PRO()) out.push(...PROsec(`Instantáneas de ${unidad} (versiones anteriores de los archivos)`),
    "# Los usuarios recuperan ellos mismos un archivo pisado: clic derecho > Restaurar versiones anteriores",
    `vssadmin add shadowstorage /for=${unidad} /on=${unidad} /maxsize=10%`,
    `$accion = New-ScheduledTaskAction -Execute "vssadmin.exe" -Argument "create shadow /for=${unidad}"`,
    "$horas  = @((New-ScheduledTaskTrigger -Daily -At 7am), (New-ScheduledTaskTrigger -Daily -At 12pm))",
    `Register-ScheduledTask -TaskName "Instantaneas ${unidad[0]}" -Action $accion -Trigger $horas -User "SYSTEM" -RunLevel Highest -Force | Out-Null`,
    "",
    "# SMBv1 desactivado",
    "Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force");
  out.push("", "Get-SmbShare | Where-Object Path -like \"$base*\" | Format-Table Name, Path");
  return L(out);
}
function ficherosLinux(f){
  const cs = carpetas(), base = ruta(S.rutaLin).replace(/\/$/, "");
  const usuarios = has("ad") ? parseCSV().usuarios : [];
  const grupoLin = dep => cs.find(c => c.etiqueta === dep)?.linux || "comun";
  const seccion = c => [
    `[${c.nombre}]`,
    `   path = ${base}/${c.nombre}`,
    `   valid users = @${c.linux}`,
    "   read only = no",
    "   create mask = 0660",
    "   directory mask = 2770",
    ...(PRO() ? ["   # ── PRO · Solo ve la carpeta quien puede entrar, y lo borrado va a una papelera",
      "   access based share enum = yes", "   hide unreadable = yes",
      "   vfs objects = recycle", "   recycle:repository = .papelera", "   recycle:keeptree = yes", "   recycle:versions = yes"] : []),
    ""];
  return L(cabeceraSH("Servidor de ficheros en Ubuntu (Samba)", f),
    "apt-get update",
    "DEBIAN_FRONTEND=noninteractive apt-get install -y samba",
    "[ -f /etc/samba/smb.conf.orig ] || cp /etc/samba/smb.conf /etc/samba/smb.conf.orig",
    "",
    "# Un grupo de Linux por carpeta; el bit setgid (2770) hace que lo nuevo herede el grupo",
    ...cs.map(c => `getent group ${c.linux} >/dev/null || groupadd ${c.linux}`),
    "",
    ...cs.flatMap(c => [`mkdir -p ${base}/${c.nombre}`, `chown root:${c.linux} ${base}/${c.nombre}`, `chmod 2770 ${base}/${c.nombre}`]),
    "",
    usuarios.length ? [
      "# Usuarios del CSV como usuarios locales sin shell (solo acceden por Samba).",
      "# Para usar los del dominio, une este Ubuntu al dominio con el módulo de Active Directory.",
      'read -rsp "Contraseña inicial de Samba para los usuarios: " PASS; echo',
      "crear_usuario() {",
      '  id "$1" &>/dev/null || useradd -M -s /usr/sbin/nologin "$1"',
      '  usermod -aG "$2" "$1"',
      `  ${S.comun ? 'usermod -aG comun "$1"' : ":"}`,
      `  printf '%s\\n%s\\n' "$PASS" "$PASS" | smbpasswd -s -a "$1" >/dev/null`,
      "}",
      ...usuarios.map(u => `crear_usuario ${u.usuario} ${grupoLin(u.depto)}`)
    ] : ["# Añade usuarios con: sudo useradd -M -s /usr/sbin/nologin ana && sudo usermod -aG GRUPO ana && sudo smbpasswd -a ana"],
    "",
    "# Configuración de Samba",
    "cat > /etc/samba/smb.conf <<'EOF'",
    "[global]",
    `   workgroup = ${NB()}`,
    `   server string = Servidor de ficheros ${host()}`,
    "   server role = standalone server",
    "   security = user",
    "   map to guest = never",
    "   log file = /var/log/samba/log.%m",
    "   max log size = 1000",
    PRO() ? ["   # ── PRO · Solo SMB3 y cifrado si el cliente lo admite",
      "   server min protocol = SMB3", "   smb encrypt = desired"] : [],
    "",
    ...cs.flatMap(seccion),
    "EOF",
    "",
    "# Comprueba la configuración y reinicia",
    "testparm -s >/dev/null",
    ufwSi(PRO() ? `ufw allow from ${derivar().cidr || S.red} to any app Samba` : "ufw allow Samba"),
    "systemctl restart smbd",
    "systemctl enable smbd",
    "smbclient -L localhost -N 2>/dev/null | grep Disk || true"
  );
}

/* ============================================================
   Servidor web
   ============================================================ */
function webWindows(f){
  const w = webFqdn(), raiz = ruta(S.webRaizWin), sitio = limpio(S.webHost);
  const out = [cabeceraPS(`Servidor web IIS: ${w}`, f),
    "Install-WindowsFeature Web-Server -IncludeManagementTools",
    "Import-Module WebAdministration",
    "",
    `$sitio = "${sitio}"`,
    `$web   = "${w}"`,
    `$raiz  = "${raiz}"`,
    "",
    "# Carpeta del sitio y una página de prueba",
    "New-Item -ItemType Directory -Path $raiz -Force | Out-Null",
    'if (-not (Test-Path "$raiz\\index.html")) {',
    `    Set-Content -Path "$raiz\\index.html" -Value "<h1>Intranet de ${S.dominio}</h1>" -Encoding UTF8`,
    "}",
    "",
    "# Sitio que responde solo al nombre de la intranet (encabezado de host)",
    "if (-not (Get-Website -Name $sitio)) {",
    "    New-Website -Name $sitio -PhysicalPath $raiz -Port 80 -HostHeader $web | Out-Null",
    "}"];
  if (PRO()) out.push(...PROsec("HTTPS"), ...certPS(w),
    'if (-not (Get-WebBinding -Name $sitio -Protocol https)) {',
    "    New-WebBinding -Name $sitio -Protocol https -Port 443 -HostHeader $web -SslFlags 1",
    '    (Get-WebBinding -Name $sitio -Protocol https).AddSslCertificate($cert.GetCertHashString(), "my")',
    "}",
    ...PROsec("Cabeceras de seguridad"),
    "# Quita las cabeceras que dicen qué servidor y versión usas",
    'Remove-WebConfigurationProperty -PSPath "MACHINE/WEBROOT/APPHOST" -Filter "system.webServer/httpProtocol/customHeaders" -Name "." -AtElement @{name = "X-Powered-By"} -ErrorAction SilentlyContinue',
    'Set-WebConfigurationProperty -PSPath "MACHINE/WEBROOT/APPHOST" -Filter "system.webServer/security/requestFiltering" -Name "removeServerHeader" -Value $true',
    "# Cabeceras que protegen frente a clickjacking, tipos MIME falsos y conexiones sin cifrar",
    "$cabeceras = @{",
    '    "X-Content-Type-Options"    = "nosniff"',
    '    "X-Frame-Options"           = "SAMEORIGIN"',
    '    "Strict-Transport-Security" = "max-age=31536000"',
    '    "Referrer-Policy"           = "strict-origin-when-cross-origin"',
    "}",
    "foreach ($c in $cabeceras.GetEnumerator()) {",
    '    Add-WebConfigurationProperty -PSPath "MACHINE/WEBROOT/APPHOST/$sitio" -Filter "system.webServer/httpProtocol/customHeaders" -Name "." -Value @{name = $c.Key; value = $c.Value} -ErrorAction SilentlyContinue',
    "}",
    "# Sin listado de carpetas",
    'Set-WebConfigurationProperty -PSPath "MACHINE/WEBROOT/APPHOST/$sitio" -Filter "system.webServer/directoryBrowse" -Name "enabled" -Value $false');
  out.push("", "Start-Website -Name $sitio", `Invoke-WebRequest "http://${w}" -UseBasicParsing | Select-Object StatusCode`);
  return L(out);
}
function webLinux(f){
  const w = webFqdn(), raiz = ruta(S.webRaizLin).replace(/\/$/, ""), sitio = limpio(S.webHost);
  const dir = [`    <Directory ${raiz}>`, "        Options -Indexes", "        AllowOverride None", "        Require all granted", "    </Directory>"];
  const logs = ["    ErrorLog ${APACHE_LOG_DIR}/" + sitio + "_error.log", "    CustomLog ${APACHE_LOG_DIR}/" + sitio + "_access.log combined"];
  const vhost = PRO() ? [
    "<VirtualHost *:80>", `    ServerName ${w}`, "    # Todo lo que llega por HTTP se manda a HTTPS", `    Redirect permanent / https://${w}/`, "</VirtualHost>", "",
    "<VirtualHost *:443>", `    ServerName ${w}`, `    DocumentRoot ${raiz}`,
    "    SSLEngine on", `    SSLCertificateFile /etc/apache2/ssl/${sitio}.crt`, `    SSLCertificateKeyFile /etc/apache2/ssl/${sitio}.key`,
    "    # Cabeceras de seguridad",
    '    Header always set Strict-Transport-Security "max-age=31536000"',
    '    Header always set X-Content-Type-Options "nosniff"',
    '    Header always set X-Frame-Options "SAMEORIGIN"',

    ...dir, ...logs, "</VirtualHost>"]

    "",
    "# Carpeta del sitio y una página de prueba",

    `[ -f ${raiz}/index.html ] || echo "<h1>Intranet de ${S.dominio}</h1>" > ${raiz}/index.html`,
    `chown -R www-data:www-data ${raiz}`,
    PRO() ? [...PROsec("HTTPS y cabeceras"), "a2enmod ssl headers", "mkdir -p /etc/apache2/ssl",
      ...certSH(w, `/etc/apache2/ssl/${sitio}.crt`, `/etc/apache2/ssl/${sitio}.key`),
      "", "# Oculta la versión de Apache y del sistema en errores y cabeceras",
      "sed -i 's/^ServerTokens .*/ServerTokens Prod/; s/^ServerSignature .*/ServerSignature Off/' /etc/apache2/conf-available/security.conf"] : [],
    "",
    `# Host virtual de ${w}`,
    `cat > /etc/apache2/sites-available/${sitio}.conf <<'EOF'`,
    ...vhost,
    "EOF",
    "",
    "# Activa el sitio, quita el de ejemplo y comprueba la sintaxis",
    `a2ensite ${sitio}`,
    "a2dissite 000-default",
    "apache2ctl configtest",
    ufwSi(PRO() ? 'ufw allow "Apache Full"' : 'ufw allow "Apache"'),

/* ============================================================
   Cortafuegos
   ============================================================ */
function puertos(){
  const p = [], ssh = String(+S.sshPuerto || 22);
  p.push({ n: "SSH", proto: "tcp", port: has("ssh") ? ssh : "22", admin: true, soloLin: !has("ssh"), nota: has("ssh") ? "" : "abierto para no quedarte fuera del servidor" });
  p.push({ n: "RDP", proto: "tcp", port: "3389", admin: true, soloWin: true, nota: "Escritorio remoto" });
  if (has("dns") || has("ad")) p.push({ n: "DNS-TCP", proto: "tcp", port: "53" }, { n: "DNS-UDP", proto: "udp", port: "53" });
  if (has("dhcp")) p.push({ n: "DHCP", proto: "udp", port: "67", todos: true, nota: "los clientes aún no tienen IP: no se puede filtrar por origen" });
  if (has("dhcp") && PRO() && S.dhcpFailover) p.push({ n: "DHCP-Failover", proto: "tcp", port: "647", soloWin: true }, { n: "DHCP-HA", proto: "tcp", port: S.linuxDhcp === "kea" ? "8000" : "647", soloLin: true, desde: S.srv2Ip });
  if (has("ficheros")) p.push({ n: "SMB", proto: "tcp", port: "445" });
  if (has("web")) { p.push({ n: "HTTP", proto: "tcp", port: "80", todos: true }); if (PRO()) p.push({ n: "HTTPS", proto: "tcp", port: "443", todos: true }); }
  if (has("ftp")) { p.push({ n: "FTP", proto: "tcp", port: "21" }); if (PRO()) p.push({ n: "FTP-Pasivo", proto: "tcp", port: `${S.pasvMin}-${S.pasvMax}` }); else p.push({ n: "FTP-Datos", proto: "tcp", port: "20", soloLin: true }); }
  return p;
}
function firewallWindows(f){
  const lan = derivar().cidr || "LocalSubnet";
  const reglas = puertos().filter(x => !x.soloLin).map(x => {
    const origen = !PRO() || x.todos ? "Any" : x.admin ? S.adminNet : (x.desde || lan);
    return `Regla "${x.n}" ${x.proto.toUpperCase()} "${x.port}" "${origen}"${x.nota ? `   # ${x.nota}` : ""}`;
  });
  return L(cabeceraPS("Cortafuegos de Windows: solo los puertos de los servicios elegidos", f),
    "# Cortafuegos activado en los tres perfiles",
    PRO() ? ["# ── PRO · Todo lo que entra se bloquea salvo lo permitido, y lo bloqueado queda registrado",
      "$perfil = @{",
      "    Profile               = @(\"Domain\", \"Private\", \"Public\")",
      "    Enabled               = \"True\"",
      "    DefaultInboundAction  = \"Block\"",
      "    DefaultOutboundAction = \"Allow\"",
      "    LogBlocked            = \"True\"",
      "    LogMaxSizeKilobytes   = 16384",
      "    LogFileName           = \"%systemroot%\\system32\\LogFiles\\Firewall\\pfirewall.log\"",
      "}",
      "Set-NetFirewallProfile @perfil"] : "Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True",
    "",
    "# Permite el ping (la regla tiene el mismo nombre interno en cualquier idioma)",

    "function Regla([string]$Nombre, [string]$Protocolo, [string]$Puertos, [string]$Origen) {",
    '    Remove-NetFirewallRule -Name "ASIRkit-$Nombre" -ErrorAction SilentlyContinue',
    '    New-NetFirewallRule -Name "ASIRkit-$Nombre" -DisplayName "ASIRkit · $Nombre" -Direction Inbound -Protocol $Protocolo -LocalPort $Puertos -RemoteAddress $Origen -Action Allow | Out-Null',
    '    Write-Host "Regla: $Nombre $Protocolo/$Puertos desde $Origen" -ForegroundColor Green',
    "}",
    "",
    PRO() ? `# Administración (RDP, SSH) solo desde ${S.adminNet}; servicios internos solo desde ${lan}` : "# Reglas de los servicios del proyecto",
    ...reglas,
    has("ad") ? ["", "# Active Directory crea sus propias reglas al instalarse (88, 135, 389, 445, 464, 636, 3268 y RPC dinámicos)"] : [],
    "",
    'Get-NetFirewallRule -Name "ASIRkit-*" | Format-Table DisplayName, Enabled, Direction, Action'
  );
}
function firewallLinux(f){
  const lan = derivar().cidr || S.red;

    "ufw status verbose"
  );
}

function backupLinux(f){
